# Generated by CloudBase - build & push on every push
name: CloudBase Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:
env:
  IMAGE_NAME: minipcer/cloudbase-react-589f4e07

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Image will be ${IMAGE_NAME}:${SHA_SHORT}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
